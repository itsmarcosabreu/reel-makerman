<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria de efeitos</title>
<style>
:root { --bg:#f6f5f2; --card:#fff; --tx:#1b1a18; --mut:#6d6a64; --borda:#e4e1da; --cor:#D97757; --cor-tx:#fff; --chip:#efece6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121212; --card:#1c1c1c; --tx:#f1efe9; --mut:#a39f97; --borda:#2c2b29; --chip:#262523; } }
:root[data-theme="dark"] { --bg:#121212; --card:#1c1c1c; --tx:#f1efe9; --mut:#a39f97; --borda:#2c2b29; --chip:#262523; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { max-width:1200px; margin:0 auto; padding:40px 16px 8px; }
h1 { margin:0 0 6px; font-size:32px; letter-spacing:-.02em; }
header p { margin:0; color:var(--mut); max-width:720px; }
.barra { max-width:1200px; margin:0 auto; padding:20px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.barra button { border:1px solid var(--borda); background:var(--card); color:var(--tx); padding:8px 16px; border-radius:999px; font:inherit; cursor:pointer; }
.barra button[aria-pressed="true"] { background:var(--tx); color:var(--bg); border-color:var(--tx); }
.barra input { flex:1; min-width:200px; border:1px solid var(--borda); background:var(--card); color:var(--tx); padding:9px 14px; border-radius:999px; font:inherit; }
main { max-width:1200px; margin:0 auto; padding:0 16px 60px; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:20px; }
.card { background:var(--card); border:1px solid var(--borda); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; }
.card img { width:100%; aspect-ratio:9/16; object-fit:cover; display:block; background:#000; }
.corpo { padding:16px; display:flex; flex-direction:column; gap:8px; flex:1; }
.topo { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.nome { font-weight:700; font-family:ui-monospace, Consolas, monospace; font-size:15px; }
.tipo { font-size:12px; background:var(--chip); color:var(--mut); padding:2px 8px; border-radius:999px; white-space:nowrap; }
.oque { margin:0; }
.info { margin:0; font-size:14px; color:var(--mut); }
.frase { margin:4px 0 0; padding:10px 12px; background:var(--chip); border-radius:10px; font-size:14px; font-style:italic; }
.copiar { margin-top:auto; border:0; background:var(--cor); color:var(--cor-tx); font:inherit; font-weight:600; padding:10px; border-radius:10px; cursor:pointer; }
.copiar.ok { background:#2f9e5b; }
.vazio { grid-column:1/-1; color:var(--mut); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>Galeria de efeitos</h1>
  <p>Escolha um efeito, copie a frase pronta, troque o trecho e os textos pelos seus e cole na conversa com o Claude. Não sabe o nome? Descreva o que quer, e o Claude sugere o mais parecido. Mais detalhes em <code>COMO-PEDIR-EFEITOS.md</code>.</p>
</header>
<div class="barra">
  <button data-f="todos" aria-pressed="true">Todos</button>
  <button data-f="tela" aria-pressed="false">De tela</button>
  <button data-f="recorte" aria-pressed="false">Com recorte</button>
  <input id="busca" type="search" placeholder="Buscar: gráfico, lista, app, logo...">
</div>
<main id="grade"></main>
<script>
const EF = [
  ['abertura','tela','Seu rosto num cartão com a cabeça saindo pela borda de cima, com frase pequena, frase grande e etiqueta colorida.','Primeiros segundos: dizer do que é o vídeo.','Só os textos.',"Abre o vídeo com a abertura: 'concluí' pequeno, '4 formações' grande e a etiqueta 'IA e dados'."],
  ['titulo','tela','Frase grande no topo, com uma palavra numa pílula colorida e o rosto num círculo no canto.','Marcar o assunto de cada parte.','Nada.',"Quando eu falo 'não use IA assim', coloca o título 'como não usar IA', com 'não' destacado."],
  ['chat','tela','Janela de chat: o pedido é digitado, a resposta aparece e ganha um selo de bom ou ruim.','Mostrar o jeito certo e o errado de pedir algo.','Os pedidos e as respostas (ou peça sugestão).',"No trecho do exemplo, mostra um chat com o pedido 'faz um relatório' marcado como ruim, e depois o pedido completo marcado como bom."],
  ['lista','tela','Itens que entram um por vez, cada um com etiqueta colorida.','Enumerar passos, critérios ou dicas.','Nada.',"Quando eu listo as decisões, coloca uma lista com 'acessos', 'esforço' e 'custo'."],
  ['etiqueta','tela','Palavra ou frase curta, grande, sobre o rosto em tela cheia.','Virada ou momento de impacto.','Nada.',"Quando eu falo 'quem decide é você', coloca a etiqueta 'quem decide'."],
  ['selo','tela','Logo, certificado ou badge que entra e sai num canto.','Quando você cita marca, ferramenta ou certificado.','A imagem do selo (PNG).',"Quando eu falo do curso da Databricks, mostra o selo dele no canto."],
  ['diagrama','tela','Palavras soltas que se juntam num centro, e do centro saem os usos.','Explicar algo que junta tudo num lugar só.','Nada.',"Quando eu explico o lakehouse, mostra planilhas, ERP e APIs se juntando no centro e saindo BI, IA e apps."],
  ['terminal','tela','Janela de código com linhas que se digitam sozinhas.','Comandos, próximos passos, checklist técnica.','Nada.',"No final, mostra um terminal digitando os próximos passos."],
  ['fecho','tela','Rosto em cartão, "me segue" grande e uma pílula com o seu @ ou link.','Últimos segundos.','Seu @ ou link.',"Fecha com 'me segue' e o meu @."],
  ['orbita','recorte','Cards com seus vídeos giram em volta de você, passando por trás e pela frente do corpo.','Portfólio, vários vídeos ou várias ferramentas.','De 5 a 7 imagens.',"Quando eu falo 'tudo que eu já gravei', coloca a órbita com prints dos meus reels."],
  ['mural-de-reels','recorte','Frase de impacto em 3 linhas no topo e reels subindo atrás de você.','Gancho forte ou frase de efeito.','De 4 a 6 imagens.',"No começo, coloca o mural com 'Postar todo dia / cansa / quando não tem plano'."],
  ['widgets-flutuantes','recorte','Widgets de vidro fosco, estilo iPhone, aparecem em volta da sua cabeça: número, gráfico, progresso, perfil.','Mostrar resultados e números.','Os números.',"Quando eu falo dos resultados, coloca widgets com '4 formações', um gráfico da semana e um anel de progresso."],
  ['ranking','recorte','Tier list de S a D: cada item aparece grande e voa para a sua fileira; o campeão cai no S por último.','Comparar opções do pior para o melhor.','Os itens e a nota de cada um.',"Quando eu comparo os jeitos de estudar, faz um ranking com decorar no D e ensinar no S."],
  ['checklist','recorte','Painel marca 5 etapas, e cada etapa acontece na tela: acha o rosto, apaga o fundo, põe texto atrás de você.','Mostrar um processo passo a passo.','Nada (ou as suas etapas).',"Quando eu explico como a IA edita, coloca o checklist com as 5 etapas acontecendo."],
  ['interface-de-app','recorte','Grades de reels atrás de você, pílulas azuis com check e um cursor clicando em "Seguir".','Pedir para seguir ou listar vantagens.','De 6 a 12 imagens (ou quadros do vídeo).',"No final, coloca a interface de app com 'Rápido', 'Fácil' e 'Grátis', e o clique no Seguir."],
  ['vox','recorte','Você como adesivo P&B sobre papel bege, com bloco amarelo, título pesado e caneta vermelha. Stop motion.','Vídeos explicativos e didáticos.','Nada.',"No começo, coloca o estilo Vox com o título 'O que a IA já faz' e a anotação 'eu testei!'."],
  ['ui-profundidade','recorte','O fundo vira um feed de app escuro e você fica na frente, enquanto as views disparam.','Falar de alcance, views ou crescimento.','De 6 a 12 imagens (ou quadros do vídeo).',"Quando eu falo das views, coloca você na frente do feed com o contador subindo até 399 mil."],
  ['recorte-em-grade','recorte','A tela se divide em 4 quadros que entram pelos cantos, e você aparece no meio como adesivo.','Mostrar várias coisas ao mesmo tempo.','4 imagens.',"Quando eu falo que juntei tudo, coloca a grade com 4 cenas e a etiqueta '4 cenas, 1 clipe'."],
  ['painel-explicativo','recorte','Painel preto com valor que dispara de antes para depois, gráfico que se desenha e você numa janela.','Evolução, antes e depois, números.','Os números verdadeiros.',"Quando eu falo quanto estudei, mostra o painel de 0 h para 120 h, com 'em 3 meses'."],
];
const grade = document.getElementById('grade'), busca = document.getElementById('busca');
let filtro = 'todos';
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function desenhar() {
  const q = busca.value.trim().toLowerCase();
  const lista = EF.filter(([n, t, o, q2, m, f]) => (filtro === 'todos' || t === filtro) && (!q || [n, o, q2, f].join(' ').toLowerCase().includes(q)));
  grade.innerHTML = lista.length ? lista.map(([n, t, o, q2, m, f]) => `
    <article class="card">
      <img src="galeria/img/fx-${n}.jpg" alt="Exemplo do efeito fx-${n}" loading="lazy">
      <div class="corpo">
        <div class="topo"><span class="nome">fx-${n}</span><span class="tipo">${t === 'tela' ? 'de tela' : 'com recorte'}</span></div>
        <p class="oque">${esc(o)}</p>
        <p class="info"><b>Quando usar:</b> ${esc(q2)}</p>
        <p class="info"><b>Você manda:</b> ${esc(m)}</p>
        <p class="frase">"${esc(f)}"</p>
        <button class="copiar" data-f="${esc(f)}">Copiar frase</button>
      </div>
    </article>`).join('') : '<p class="vazio">Nenhum efeito com essa busca. Tente descrever de outro jeito.</p>';
}
document.querySelectorAll('.barra button').forEach((b) => b.onclick = () => {
  filtro = b.dataset.f; document.querySelectorAll('.barra button').forEach((x) => x.setAttribute('aria-pressed', x === b)); desenhar();
});
busca.oninput = desenhar;
grade.onclick = async (e) => {
  const b = e.target.closest('.copiar'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.f); }
  catch { const t = document.createElement('textarea'); t.value = b.dataset.f; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  b.textContent = 'Copiado!'; b.classList.add('ok'); setTimeout(() => { b.textContent = 'Copiar frase'; b.classList.remove('ok'); }, 1500);
};
desenhar();
</script>
</body>
</html>
